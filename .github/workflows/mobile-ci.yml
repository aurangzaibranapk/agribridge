name: Mobile CI

on:
  push:
    branches: [testing/shop-360-zero-leakage]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --project-name agribridge --org pk.alranatraders .
          rm -f test/widget_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Testing APK
        run: flutter build apk --debug --dart-define=APP_ENV=testing
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: agribridge-testing-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
