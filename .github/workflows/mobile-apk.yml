name: Mobile debug APK

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: agribridge-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared version and mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mobile

  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Export Android bundle and check the size budget
        working-directory: apps/mobile
        env:
          APP_CHANNEL: debug
          EXPO_PUBLIC_PORTAL_URL: https://alranatraders.pk
        run: npx expo export --platform android --output-dir dist
      - run: node scripts/check-mobile-bundle.mjs apps/mobile/dist
      - name: Prebuild and assemble the debug APK
        working-directory: apps/mobile
        env:
          APP_CHANNEL: debug
          EXPO_PUBLIC_PORTAL_URL: https://alranatraders.pk
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agribridge-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
