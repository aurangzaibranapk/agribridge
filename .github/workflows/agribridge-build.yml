name: AgriBridge Build Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agribridge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AgriBridge
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check:i18n

      - name: Build AgriBridge
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Package cPanel release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          package_dir="$(mktemp -d)"
          for item in .next public package.json package-lock.json next.config.js server.js; do
            cp -R -- "$item" "$package_dir/"
          done
          rm -rf -- "$package_dir/.next/cache" "$package_dir/.next/types"
          rm -f -- "$package_dir/.next/trace"
          mkdir -p "$package_dir/.release"
          cp scripts/verify-cpanel-runtime.mjs "$package_dir/.release/verify.mjs"
          node scripts/create-cpanel-manifest.mjs "$package_dir"
          node "$package_dir/.release/verify.mjs" "$package_dir"
          tar -czf agribridge-cpanel-release.tar.gz -C "$package_dir" .next public package.json package-lock.json next.config.js server.js .release
          sha256sum agribridge-cpanel-release.tar.gz > agribridge-cpanel-release.sha256

      - name: Upload cPanel release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: agribridge-cpanel-${{ github.sha }}
          path: |
            agribridge-cpanel-release.tar.gz
            agribridge-cpanel-release.sha256
          if-no-files-found: error
          retention-days: 14
