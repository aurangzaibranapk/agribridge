name: Mobile sideload APKs

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/mobile-phase1-4b80

permissions:
  contents: write

concurrency:
  group: agribridge-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sideload:
    name: arm64 and armeabi-v7a release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_CHANNEL: internal
      EXPO_PUBLIC_PORTAL_URL: https://alranatraders.pk
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Assemble sideload release APKs
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PagribridgeSideload=true \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.enableProguardInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pexpo.useLegacyPackaging=true \
            -PhermesEnabled=true \
            -Pandroid.minSdkVersion=24
      - name: Verify and name the APKs
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          chmod +x scripts/verify-sideload-apk.sh
          mkdir -p sideload-out
          copy() {
            local abi="$1"
            local src
            src=$(find android/app/build/outputs/apk/release -name "*${abi}*release*.apk" ! -name '*unsigned*' | head -1)
            if [[ -z "$src" ]]; then
              echo "missing $abi apk"
              find android/app/build/outputs/apk -type f
              exit 1
            fi
            local dest="sideload-out/agribridge-v0.6.1-beta-${abi}.apk"
            cp "$src" "$dest"
            scripts/verify-sideload-apk.sh "$dest" "$abi" | tee "sideload-out/${abi}.verify.txt"
          }
          copy arm64-v8a
          copy armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: agribridge-mobile-sideload-arm64-v8a
          path: apps/mobile/sideload-out/agribridge-v0.6.1-beta-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: agribridge-mobile-sideload-armeabi-v7a
          path: apps/mobile/sideload-out/agribridge-v0.6.1-beta-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: agribridge-mobile-sideload-verify
          path: apps/mobile/sideload-out/*.verify.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease v0.6.1-beta-test1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.1-beta-test1
          name: v0.6.1-beta-test1
          prerelease: true
          generate_release_notes: false
          files: |
            apps/mobile/sideload-out/agribridge-v0.6.1-beta-arm64-v8a.apk
            apps/mobile/sideload-out/agribridge-v0.6.1-beta-armeabi-v7a.apk
          body: |
            Sideload test builds for phones. Not a Play Store upload.
            versionName v0.6.1 Beta, versionCode 601, APP_CHANNEL=internal.
            arm64-v8a is the APK for almost every phone since 2019.
            armeabi-v7a is the separate APK for older 32-bit phones.
            Signed with the Android debug keystore. R8 and Hermes are on.
            minSdk 24 (Android 7), so Android 8 and newer can install.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
