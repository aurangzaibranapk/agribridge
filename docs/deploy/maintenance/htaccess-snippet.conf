# ===== BEGIN AgriBridge maintenance (Apache level) =====
# Paste ABOVE the "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN" block
# in the DOCUMENT ROOT .htaccess of alranatraders.pk. Never inside that block
# (cPanel rewrites it on every Start/Stop/Restart).
<IfModule mod_rewrite.c>
  RewriteEngine On
  # Planned deploy: flag file present -> 503 for every page.
  # Allowed through: /.well-known/ (assetlinks, AutoSSL/ACME) and the page itself.
  RewriteCond %{DOCUMENT_ROOT}/ab-maintenance/deploy-in-progress.flag -f
  RewriteCond %{REQUEST_URI} !^/\.well-known/ [NC]
  RewriteCond %{REQUEST_URI} !^/ab-maintenance/ [NC]
  RewriteRule ^ - [R=503,L]
</IfModule>

# The page Apache shows for its OWN errors. While Node runs, Passenger passes
# the app's own 404s straight through (PassengerErrorOverride is off by
# default), so these only take effect when Node is stopped/crashed.
ErrorDocument 503 /ab-maintenance/index.html
ErrorDocument 502 /ab-maintenance/index.html
ErrorDocument 500 /ab-maintenance/index.html
ErrorDocument 404 /ab-maintenance/index.html
ErrorDocument 403 /ab-maintenance/index.html

<IfModule mod_headers.c>
  Header always set Retry-After "300" "expr=%{REQUEST_STATUS} == 503"
  Header always set Cache-Control "no-store, max-age=0" "expr=%{REQUEST_STATUS} -in {'403','404','500','502','503'} && %{REQUEST_URI} !~ m#^/_next/#"
  Header always set X-Robots-Tag "noindex" "expr=%{REQUEST_STATUS} == 503"
</IfModule>

# The flag and folder listing are never public.
<IfModule mod_authz_core.c>
  <FilesMatch "^deploy-in-progress\.flag">
    Require all denied
  </FilesMatch>
</IfModule>
# ===== END AgriBridge maintenance =====
