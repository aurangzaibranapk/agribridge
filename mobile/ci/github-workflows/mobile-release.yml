name: Mobile Play Bundle

# Haath se chalta hai. Signed .aab artifact banata hai; Play Console par
# upload owner khud karta hai (koi auto-publish nahi).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        required: true
        default: testing
        type: choice
        options: [testing, production]
      build_name:
        description: Version name (e.g. 1.0.0)
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: Version code (Play par har dafa pichhle se bara; TWA wale versionCode se bhi)
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment == 'production' && 'mobile-production' || 'mobile-testing' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Select environment secrets
        env:
          APP_ENV: ${{ inputs.environment }}
          PROD_URL: ${{ secrets.MOBILE_PROD_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.MOBILE_PROD_SUPABASE_ANON_KEY }}
          PROD_API: ${{ secrets.MOBILE_PROD_API_BASE_URL }}
          TEST_URL: ${{ secrets.MOBILE_TEST_SUPABASE_URL }}
          TEST_KEY: ${{ secrets.MOBILE_TEST_SUPABASE_ANON_KEY }}
          TEST_API: ${{ secrets.MOBILE_TEST_API_BASE_URL }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$BUILD_NAME" in (*[!0-9.]*|'') echo "::error::build_name sirf 1.2.3 jaisa"; exit 1;; esac
          case "$BUILD_NUMBER" in (*[!0-9]*|'') echo "::error::build_number sirf hindse"; exit 1;; esac
          if [ "$APP_ENV" = production ]; then
            [ "$REF" = refs/heads/main ] || { echo "::error::Production bundle sirf main se"; exit 1; }
            URL="$PROD_URL"; KEY="$PROD_KEY"; API="$PROD_API"
            [ "$URL" = "https://ktskwawkslaznkjjacni.supabase.co" ] || { echo "::error::MOBILE_PROD_SUPABASE_URL live project nahi"; exit 1; }
          else
            URL="$TEST_URL"; KEY="$TEST_KEY"; API="$TEST_API"
          fi
          test -n "$URL" || { echo "::error::Supabase URL secret missing"; exit 1; }
          test -n "$KEY" || { echo "::error::Supabase anon key secret missing"; exit 1; }
          case "$URL" in https://*) ;; *) echo "::error::Supabase URL https nahi"; exit 1;; esac
          case "$API" in https://*) ;; *) echo "::error::API base URL https nahi"; exit 1;; esac
          if printf '%s' "$KEY" | grep -q 'service_role'; then echo "::error::Service-role key app mein kabhi nahi"; exit 1; fi
          {
            echo "MOBILE_SUPABASE_URL=$URL"
            echo "MOBILE_SUPABASE_KEY=$KEY"
            echo "MOBILE_API_BASE_URL=$API"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEY"
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name agribridge --org pk.alranatraders .
          rm -f test/widget_test.dart
          python3 tool/configure_android.py
      - name: Configure private signing
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 tool/configure_signing.py
      - name: Add Firebase configuration (optional)
        env:
          FIREBASE_JSON_B64: ${{ inputs.environment == 'production' && secrets.MOBILE_PROD_FIREBASE_ANDROID_JSON_BASE64 || secrets.MOBILE_FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_B64" ]; then
            printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
            python3 tool/configure_firebase.py
            echo "MOBILE_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "MOBILE_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            echo "Firebase configuration omitted; push notifications band rahengi."
          fi
      - name: Dependencies and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build signed AAB
        env:
          APP_ENV: ${{ inputs.environment }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=APP_VERSION="$BUILD_NAME" \
            --dart-define=SUPABASE_URL="$MOBILE_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$MOBILE_SUPABASE_KEY" \
            --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" \
            --dart-define=FIREBASE_MESSAGING_ENABLED="$MOBILE_FIREBASE_ENABLED"
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: agribridge-${{ inputs.environment }}-${{ inputs.build_name }}-${{ inputs.build_number }}-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
